<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestionPerfil</title>
    <link rel="stylesheet" href="/CSS/stylesGestionPerfil.css">
    <link rel="stylesheet" href="/CSS/stylesBarraSuperior.css">
    <link rel="icon" href="ico.png" type="image/png">
    <script src="/JAVASCRIPT/BotonesBarraSuperiorScript.js" defer></script>
    <!-- Font Awesome gratuito -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- Barra superior -->
    <header class="Barra_Superior">

    <div class="logo-menu">
        <!-- HAMBURGUESA A LA IZQUIERDA -->
        <div class="hamburger" id="hamburgerMenu">☰</div>

        <!-- LOGO/TÍTULO -->
        <h1 class="Fitalia_Bar">FITALIA</h1>

        <!-- MENÚ DESPLEGABLE -->
        <div class="dropdown-menu" id="dropdownMenu">
            <a href="PrincipalRegistrado.html">Home</a>
            <a href="Home.html">Cerrar sesión</a>
        </div>
    </div>

    

</header>

    <main class="contenedor">
        <!-- Contenedor del perfil -->
        <section class="contenedor-perfil">
            <div class="foto-perfil">
                <a href="#"><img src="/ASSERTS/GestionPerfil/perfilFoto.png" alt="Foto de perfil"></a>
                
                
            </div>
            <h2 class="nombre-usuario">David Restrepo</h2>
        </section>

        <!-- Contenedor del formulario -->
        <section class="contenedor-formulario">
            <form class="formulario">
                <div class="campo">
                    <label>Nombre</label>
                    <input type="text">
                   
                </div>

                <div class="campo">
                    <label>Apellidos</label>
                    <input type="text">
                    
                </div>

                <div class="campo">
                    <label>Correo Electrónico</label>
                    <input type="email">
                    
                </div>

                <div class="campo">
                    <label>Fecha de cumpleaños (MM/DD/YY)</label>
                    <input type="date">
                    
                </div>

                <div class="campo">
                    <label>Contraseña</label>
                    <input type="password">
                    
                </div>
            </form>
        </section>
    </main>
</body>
</html>
